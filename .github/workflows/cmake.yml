name: CMake

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    # Pinned rather than windows-latest so a runner image change cannot silently switch toolsets.
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        configuration: [ "Debug", "Release" ]
    env:
      VERSION_TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '0.0.0-dev' }}

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        submodules: true

    # Replaces ilammy/msvc-dev-cmd, which still runs on the deprecated Node.js 20.
    # SimCity 4 is a 32-bit process, so the driver must be built x86.
    - name: Add MSVC to PATH
      shell: pwsh
      run: |
        $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
        $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
        if (-not $vs) { throw "Visual Studio with the C++ tools was not found" }
        $vcvars = Join-Path $vs "VC\Auxiliary\Build\vcvarsall.bat"
        $before = $env:PATH -split ';'
        $vars = cmd /c "`"$vcvars`" x86 >nul && set"
        if ($LASTEXITCODE -ne 0) { throw "vcvarsall.bat x86 failed" }
        foreach ($line in $vars) {
          if ($line -notmatch '^([^=]+)=(.*)$') { continue }
          $name, $value = $Matches[1], $Matches[2]
          if ($name -ieq 'PATH') {
            # New entries go first in GITHUB_PATH, so add them in reverse to keep their order.
            $added = @($value -split ';' | Where-Object { $_ -and $before -notcontains $_ })
            [array]::Reverse($added)
            $added | Out-File $env:GITHUB_PATH -Append -Encoding utf8
          } else {
            "$name=$value" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          }
        }

    - name: Configure
      run: >-
        cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=${{ matrix.configuration }}
        "-DSCD3D11_VERSION_TAG=${{ env.VERSION_TAG }}"

    - name: Build
      run: cmake --build build

    # The C++ runtime is linked in, so players need no Visual C++ Redistributable. A dependency that
    # brings back /MD would make SC4 skip the DLL without a word on machines that lack it.
    - name: Check for runtime imports
      shell: pwsh
      run: |
        $imports = dumpbin /nologo /dependents build/SCD3D11.dll |
          Select-String -Pattern '^\s+(\S+\.dll)\s*$' | ForEach-Object { $_.Matches[0].Groups[1].Value }
        if (-not $imports) { throw "dumpbin listed no imports for SCD3D11.dll" }
        $runtime = @($imports | Where-Object { $_ -match '^(msvcp|vcruntime|concrt|ucrtbase|api-ms-win-crt-)' })
        if ($runtime) { throw "SCD3D11.dll imports the C++ runtime: $($runtime -join ', ')" }

    - name: Test
      run: ctest --test-dir build --output-on-failure

    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      if: matrix.configuration == 'Release'
      with:
        python-version: "3.12"

    - name: Generate and validate SBOMs
      if: matrix.configuration == 'Release'
      shell: bash
      run: |
        python scripts/generate_sbom.py "$VERSION_TAG" build/SCD3D11.dll build
        python -m pip install --disable-pip-version-check -q spdx-tools "cyclonedx-python-lib[json-validation]"
        pyspdxtools -i build/SCD3D11.spdx.json
        python - <<'EOF'
        import sys
        from cyclonedx.schema import SchemaVersion
        from cyclonedx.validation.json import JsonStrictValidator
        error = JsonStrictValidator(SchemaVersion.V1_6).validate_str(open("build/SCD3D11.cdx.json").read())
        sys.exit(error and f"CycloneDX SBOM is invalid: {error}")
        EOF

    - name: Upload Artifacts
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: SCD3D11-${{ matrix.configuration }}
        # The SBOMs and the PDB only exist for Release, but the DLL is always required.
        path: |
          build/SCD3D11.dll
          build/SCD3D11.pdb
          build/SCD3D11.*.json
        if-no-files-found: error

  validate-tag:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
    - name: Validate version tag
      env:
        TAG_NAME: ${{ github.ref_name }}
      run: |
        if [[ ! "$TAG_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
          echo "Release tags must match vMAJOR.MINOR.PATCH[-PRERELEASE], for example v1.2.0 or v1.2.0-rc.1. Got: $TAG_NAME"
          exit 1
        fi

  # Pushing a tag such as v1.2.0 publishes the tested Release build, and v1.2.0-rc1 becomes a prerelease.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, validate-tag]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # For the signed attestations.
      id-token: write
      attestations: write
      artifact-metadata: write

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: SCD3D11-Release
        path: dist

    - name: Create release zip
      run: >-
        zip -j "SCD3D11-${GITHUB_REF_NAME}.zip" dist/SCD3D11.dll SCD3D11.ini dist/SCD3D11.spdx.json
        dist/SCD3D11.cdx.json README.md LICENSE THIRD_PARTY_NOTICES.txt

    # Build provenance: proves that this workflow built these files from this commit. Players check it
    # with `gh attestation verify <file> --repo caspervg/scd3d11`. The DLL is a subject too, so the file
    # in a plugins folder can be checked without the zip.
    - name: Attest build provenance
      uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
      with:
        subject-path: |
          SCD3D11-${{ github.ref_name }}.zip
          dist/SCD3D11.dll
          dist/SCD3D11.pdb
          dist/SCD3D11.spdx.json
          dist/SCD3D11.cdx.json

    - name: Attest SBOM
      uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
      with:
        subject-path: |
          SCD3D11-${{ github.ref_name }}.zip
          dist/SCD3D11.dll
        sbom-path: dist/SCD3D11.spdx.json

    - name: Publish GitHub release
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        archive="SCD3D11-${GITHUB_REF_NAME}.zip"
        prerelease=""
        if [[ "$GITHUB_REF_NAME" == *-* ]]; then prerelease="--prerelease"; fi
        # Notes written for the tag come first, above the generated list of changes.
        notes=()
        notesFile=".github/release-notes/${GITHUB_REF_NAME}.md"
        if [[ -f "$notesFile" ]]; then notes=(--notes-file "$notesFile"); fi
        gh release create "$GITHUB_REF_NAME" "$archive" dist/SCD3D11.pdb dist/SCD3D11.spdx.json dist/SCD3D11.cdx.json \
          --verify-tag --generate-notes "${notes[@]}" $prerelease

  # Points the sc4pac package at the new release on a branch of caspervg/simtropolis-channel, and
  # links to a prefilled pull request in the job summary. Prereleases never reach sc4pac, so they
  # don't get the fork token either.
  sc4pac:
    if: ${{ !contains(github.ref_name, '-') }}
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    environment: sc4pac
    concurrency: sc4pac-caspervg-scd3d11

    steps:
    - uses: caspervg/sc4pac-release-action@af95bc5692cab0a3b32e50aac5b82eb8249ffca9 # v1.0.0
      with:
        channel: sebamarynissen/simtropolis-channel
        asset-id: caspervg-scd3d11
        asset-name: SCD3D11-${{ github.ref_name }}.zip
        token: ${{ secrets.SC4PAC_FORK_TOKEN }}
