name: CMake

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    # Pinned rather than windows-latest: the VS 2022 toolset keeps the VC++ runtime dependency
    # compatible with older Windows versions such as Windows 7.
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        configuration: [ "Debug", "Release" ]
    env:
      VERSION_TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '0.0.0-dev' }}

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: true

    - name: Add MSVC to PATH
      uses: ilammy/msvc-dev-cmd@v1
      with:
        # SimCity 4 is a 32-bit process, so the driver must be built x86.
        arch: x86

    - name: Configure
      run: >-
        cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=${{ matrix.configuration }}
        -DSCD3D11_VERSION_TAG=${{ env.VERSION_TAG }}

    - name: Build
      run: cmake --build build

    - name: Test
      run: ctest --test-dir build --output-on-failure

    - uses: actions/setup-python@v5
      if: matrix.configuration == 'Release'
      with:
        python-version: "3.12"

    - name: Generate and validate SBOMs
      if: matrix.configuration == 'Release'
      shell: bash
      run: |
        python scripts/generate_sbom.py "$VERSION_TAG" build/SCD3D11.dll build
        python -m pip install --disable-pip-version-check -q spdx-tools "cyclonedx-python-lib[json-validation]"
        pyspdxtools -i build/SCD3D11.spdx.json
        python - <<'EOF'
        import sys
        from cyclonedx.schema import SchemaVersion
        from cyclonedx.validation.json import JsonStrictValidator
        error = JsonStrictValidator(SchemaVersion.V1_6).validate_str(open("build/SCD3D11.cdx.json").read())
        sys.exit(error and f"CycloneDX SBOM is invalid: {error}")
        EOF

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: SCD3D11-${{ matrix.configuration }}
        # SBOMs only exist for Release; the DLL is still required.
        path: |
          build/SCD3D11.dll
          build/SCD3D11.*.json
        if-no-files-found: error

  # Pushing a tag such as v1.2.0 publishes the tested Release build; v1.2.0-rc1 becomes a prerelease.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4

    - uses: actions/download-artifact@v4
      with:
        name: SCD3D11-Release
        path: dist

    - name: Publish GitHub release
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        archive="SCD3D11-${GITHUB_REF_NAME}.zip"
        zip -j "$archive" dist/SCD3D11.dll dist/SCD3D11.spdx.json dist/SCD3D11.cdx.json README.md LICENSE
        prerelease=""
        if [[ "$GITHUB_REF_NAME" == *-* ]]; then prerelease="--prerelease"; fi
        gh release create "$GITHUB_REF_NAME" "$archive" dist/SCD3D11.spdx.json dist/SCD3D11.cdx.json \
          --verify-tag --generate-notes $prerelease
