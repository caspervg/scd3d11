name: CMake

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    # Pinned rather than windows-latest so a runner image change cannot silently switch toolsets.
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        configuration: [ "Debug", "Release" ]
    env:
      VERSION_TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '0.0.0-dev' }}

    steps:
    - uses: actions/checkout@v7
      with:
        submodules: true

    # Replaces ilammy/msvc-dev-cmd, which still runs on the deprecated Node.js 20.
    # SimCity 4 is a 32-bit process, so the driver must be built x86.
    - name: Add MSVC to PATH
      shell: pwsh
      run: |
        $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
        $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
        if (-not $vs) { throw "Visual Studio with the C++ tools was not found" }
        $vcvars = Join-Path $vs "VC\Auxiliary\Build\vcvarsall.bat"
        $before = $env:PATH -split ';'
        $vars = cmd /c "`"$vcvars`" x86 >nul && set"
        if ($LASTEXITCODE -ne 0) { throw "vcvarsall.bat x86 failed" }
        foreach ($line in $vars) {
          if ($line -notmatch '^([^=]+)=(.*)$') { continue }
          $name, $value = $Matches[1], $Matches[2]
          if ($name -ieq 'PATH') {
            # New entries go first in GITHUB_PATH, so add them in reverse to keep their order.
            $added = @($value -split ';' | Where-Object { $_ -and $before -notcontains $_ })
            [array]::Reverse($added)
            $added | Out-File $env:GITHUB_PATH -Append -Encoding utf8
          } else {
            "$name=$value" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          }
        }

    - name: Configure
      run: >-
        cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=${{ matrix.configuration }}
        "-DSCD3D11_VERSION_TAG=${{ env.VERSION_TAG }}"

    - name: Build
      run: cmake --build build

    # The C++ runtime is linked in, so players need no Visual C++ Redistributable. A dependency that
    # brings back /MD would make SC4 skip the DLL without a word on machines that lack it.
    - name: Check for runtime imports
      shell: pwsh
      run: |
        $imports = dumpbin /nologo /dependents build/SCD3D11.dll |
          Select-String -Pattern '^\s+(\S+\.dll)\s*$' | ForEach-Object { $_.Matches[0].Groups[1].Value }
        if (-not $imports) { throw "dumpbin listed no imports for SCD3D11.dll" }
        $runtime = @($imports | Where-Object { $_ -match '^(msvcp|vcruntime|concrt|ucrtbase|api-ms-win-crt-)' })
        if ($runtime) { throw "SCD3D11.dll imports the C++ runtime: $($runtime -join ', ')" }

    - name: Test
      run: ctest --test-dir build --output-on-failure

    - uses: actions/setup-python@v7
      if: matrix.configuration == 'Release'
      with:
        python-version: "3.12"

    - name: Generate and validate SBOMs
      if: matrix.configuration == 'Release'
      shell: bash
      run: |
        python scripts/generate_sbom.py "$VERSION_TAG" build/SCD3D11.dll build
        python -m pip install --disable-pip-version-check -q spdx-tools "cyclonedx-python-lib[json-validation]"
        pyspdxtools -i build/SCD3D11.spdx.json
        python - <<'EOF'
        import sys
        from cyclonedx.schema import SchemaVersion
        from cyclonedx.validation.json import JsonStrictValidator
        error = JsonStrictValidator(SchemaVersion.V1_6).validate_str(open("build/SCD3D11.cdx.json").read())
        sys.exit(error and f"CycloneDX SBOM is invalid: {error}")
        EOF

    - name: Upload Artifacts
      uses: actions/upload-artifact@v7
      with:
        name: SCD3D11-${{ matrix.configuration }}
        # The SBOMs and the PDB only exist for Release, but the DLL is always required.
        path: |
          build/SCD3D11.dll
          build/SCD3D11.pdb
          build/SCD3D11.*.json
        if-no-files-found: error

  # Pushing a tag such as v1.2.0 publishes the tested Release build, and v1.2.0-rc1 becomes a prerelease.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v7

    - uses: actions/download-artifact@v8
      with:
        name: SCD3D11-Release
        path: dist

    - name: Publish GitHub release
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        archive="SCD3D11-${GITHUB_REF_NAME}.zip"
        zip -j "$archive" dist/SCD3D11.dll SCD3D11.ini dist/SCD3D11.spdx.json dist/SCD3D11.cdx.json README.md LICENSE THIRD_PARTY_NOTICES.txt
        prerelease=""
        if [[ "$GITHUB_REF_NAME" == *-* ]]; then prerelease="--prerelease"; fi
        # Notes written for the tag come first, above the generated list of changes.
        notes=()
        notesFile=".github/release-notes/${GITHUB_REF_NAME}.md"
        if [[ -f "$notesFile" ]]; then notes=(--notes-file "$notesFile"); fi
        gh release create "$GITHUB_REF_NAME" "$archive" dist/SCD3D11.pdb dist/SCD3D11.spdx.json dist/SCD3D11.cdx.json \
          --verify-tag --generate-notes "${notes[@]}" $prerelease
