; SCD3D11 settings. Keep this file next to SCD3D11.dll in your Plugins folder.
; A launch switch of the same name overrides a line here for one session,
; e.g. -LiveShadows:off or -VSync:on. Values: on or off (also enabled/disabled,
; true/false and 1/0).
[SCD3D11]

; Real cast shadows along SC4's own sun: buildings, trees, props and network
; pieces shade each other, slopes and walls, and hills shade the land behind
; them. Costs some frame rate, most while scrolling.
LiveShadows=off

; With LiveShadows, keep the flat FSH shadow masks of prebuilt network pieces.
; They are dropped by default because those pieces already cast live.
NetworkShadowMasks=off

; Wait for the monitor's refresh before showing a frame.
VSync=on

; A monitor-sized borderless window instead of exclusive fullscreen. Needs no
; -f, and wins over -w.
Borderless=off

; Windowed and borderless: present with the flip model (off: the legacy
; DISCARD swap chain).
FlipModel=on

; high-performance: the discrete GPU on laptops with two. default: the GPU
; Windows picks. A number picks that GPU from the list in Logs\SCD3D11.log.
GPU=high-performance

; Skip draws that lie entirely outside a scroll redraw's small viewport.
ViewportCull=on

; Round depth onto the 16-bit grid of SC4's DirectX 7 driver. SC4 stacks road,
; lot, shadow and decal textures on the ground a 16-bit step apart; with off they
; can flicker or stripe through each other.
Depth16=on

; Render ReShade's effects before the UI and give them the city's depth
; (off: ReShade's default behaviour).
ReShade=on

; Drag with the middle mouse button to turn and tilt the city view, scroll
; for smooth zoom, hold ALT for the classic angle.
FreeCamera=off

; Once per day, ask GitHub whether a newer SCD3D11 is out, and offer its
; download page when the region view opens. Turning this off is not
; recommended: older versions can clash with other plugins and are not
; supported.
UpdateCheck=on

; The vertex cache keeps SC4's geometry on the GPU between frames. It has
; VertexCacheSegments segments (1-16) of VertexCacheSize MB each (4-64), 128 MB
; by default. More holds more of a large city and stutters less while panning,
; but SC4 is a 32-bit game: on some drivers each MB costs two of the game's
; 4 GB address space. Lower them if the game runs out of memory. The cache
; also shrinks on its own when free address space gets low.
VertexCacheSegments=8
VertexCacheSize=16

; Diagnostics, written to Logs\SCD3D11.log: a per-second frame summary, and
; LogLevel=trace for high-volume events.
DrawStats=off
LogLevel=info
