; SCD3D11 settings. Keep this file next to SCD3D11.dll in your Plugins folder.
; A launch switch of the same name overrides a line here for one session,
; e.g. -LiveShadows:off or -VSync:on. Values: on or off (also enabled/disabled,
; true/false and 1/0).
[SCD3D11]

; Real cast shadows along SC4's own sun: buildings, trees, props and network
; pieces shade each other, slopes and walls, and hills shade the land behind
; them. Costs some frame rate, most while scrolling.
LiveShadows=off

; With LiveShadows, keep the flat FSH shadow masks of prebuilt network pieces.
; They are dropped by default because those pieces already cast live.
NetworkShadowMasks=off

; With LiveShadows, let the sun move through SC4's day as it would at this
; latitude on midsummer day, e.g. SunLatitude=51 (negative for the south).
; The sun moves a step about every 4 seconds while the clock runs, and only
; the shadows are redrawn. off keeps SC4's fixed sun.
SunLatitude=off

; Wait for the monitor's refresh before showing a frame.
VSync=on

; With -f, a monitor-sized borderless window instead of exclusive fullscreen.
Borderless=off

; Windowed and borderless: present with the flip model (off: the legacy
; DISCARD swap chain).
FlipModel=on

; high-performance: the discrete GPU on laptops with two. default: the GPU
; Windows picks.
GPU=high-performance

; Sharper textures on surfaces seen at a slant, such as the terrain and roads:
; off, or 2, 4, 8 or 16 samples. Nearly free on any recent GPU.
Anisotropy=off

; Skip draws that lie entirely outside a scroll redraw's small viewport.
ViewportCull=on

; Render ReShade's effects before the UI and give them the city's depth
; (off: ReShade's default behaviour).
ReShade=on

; Diagnostics, written to Logs\SCD3D11.log: a per-second frame summary, and
; LogLevel=trace for high-volume events.
DrawStats=off
LogLevel=info
